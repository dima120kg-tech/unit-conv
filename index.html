<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101722">
  <meta name="description" content="Офлайн-конвертер метрических и имперских единиц">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>UNIT CONV</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1119;--panel:#151f2c;--panel2:#1d2a39;--line:#2b3a4c;--text:#f3f6fa;--muted:#9aabba;--accent:#58b7ff;--good:#5bd39a}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#18283a 0,#0b1119 58%);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
    .app{max-width:560px;margin:0 auto;padding:22px 0 30px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-size:22px;font-weight:850;letter-spacing:1.8px}.brand span{color:var(--accent)}.status{font-size:12px;color:var(--good);border:1px solid #285d4a;border-radius:20px;padding:7px 10px}
    .panel{background:rgba(21,31,44,.96);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 12px 30px #0003}.label{display:block;color:var(--muted);font-size:13px;margin:0 0 8px}.select,input,button{font:inherit}.select,input{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;outline:none}.select:focus,input:focus{border-color:var(--accent)}
    .unitrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.valuegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.valuebox{min-width:0}.swaprow{display:flex;justify-content:center;margin:-2px 0}.swap{width:48px;height:48px;border:1px solid var(--line);border-radius:15px;background:#223348;color:var(--accent);font-size:23px}
    .result{background:#10283a;border:1px solid #28506b;border-radius:16px;padding:16px;margin-top:14px}.result .label{margin-bottom:6px}.out{font-size:clamp(25px,7vw,34px);font-weight:800;overflow-wrap:anywhere}.out small{font-size:15px;color:#b8d9ee;font-weight:600}.actions{display:flex;gap:10px;margin-top:12px}.btn{flex:1;border:1px solid var(--line);border-radius:12px;padding:13px;background:#223348;color:var(--text);font-weight:650}.btn.primary{background:var(--accent);border-color:var(--accent);color:#071522}.quick{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#1d2a39;color:#cbd9e5;border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-size:13px}.foot{color:var(--muted);font-size:12px;line-height:1.5;text-align:center;padding:10px 8px}.hidden{display:none}
    @media(max-width:370px){body{padding-left:11px;padding-right:11px}.panel{padding:14px}.unitrow,.valuegrid{gap:7px}.select,input{padding:12px;font-size:15px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">UNIT <span>CONV</span></div><div class="status" id="status">● ОФЛАЙН ГОТОВ</div></header>
  <section class="panel">
    <label class="label" for="category">КАТЕГОРИЯ</label>
    <select class="select" id="category"></select>
    <div class="valuegrid">
      <div class="valuebox"><label class="label" for="fromValue">ИЗ</label><input id="fromValue" type="number" inputmode="decimal" value="1" step="any"></div>
      <div class="valuebox"><label class="label" for="toValue">В</label><input id="toValue" type="text" readonly value=""></div>
    </div>
    <div class="unitrow" style="margin-top:10px">
      <select class="select" id="fromUnit" aria-label="Исходная единица"></select>
      <select class="select" id="toUnit" aria-label="Целевая единица"></select>
    </div>
    <div class="swaprow"><button class="swap" id="swap" aria-label="Поменять единицы местами">⇅</button></div>
    <div class="result"><div class="label">РЕЗУЛЬТАТ</div><div class="out" id="result">—</div></div>
    <div class="actions"><button class="btn primary" id="copy">Копировать результат</button><button class="btn" id="reset">Сбросить</button></div>
  </section>
  <section class="panel"><div class="label">БЫСТРЫЕ ПАРЫ</div><div class="quick" id="quick"></div></section>
  <div class="foot">Работает без интернета после первого открытия. Для технических и авиационных работ сверяйте значения с утверждённой документацией.</div>
</div>
<script>
const defs={
 'Длина':[['mm','мм',.001],['cm','см',.01],['m','м',1],['km','км',1000],['in','дюйм',.0254],['ft','фут',.3048],['yd','ярд',.9144],['mi','миля',1609.344]],
 'Масса':[['g','г',.001],['kg','кг',1],['t','т',1000],['oz','унция',.028349523125],['lb','фунт',.45359237],['st','стоун',6.35029318]],
 'Давление':[['Pa','Па',1],['kPa','кПа',1000],['MPa','МПа',1e6],['bar','бар',100000],['mbar','мбар',100],['psi','psi',6894.757293],['inHg','inHg',3386.389],['mmHg','мм рт.ст.',133.322387]],
 'Температура':[['C','°C'],['F','°F'],['K','K']],
 'Скорость':[['m/s','м/с',1],['km/h','км/ч',1/3.6],['kt','узел',.5144444444],['mph','миль/ч',.44704],['ft/s','фут/с',.3048]],
 'Объём':[['mL','мл',.001],['L','л',1],['m³','м³',1000],['US gal','US галлон',3.785411784],['Imp gal','Imp галлон',4.54609],['US qt','US кварта',.946352946],['US pt','US пинта',.473176473]],
 'Расход топлива':[['L/h','л/ч',1],['US gal/h','US гал/ч',3.785411784],['Imp gal/h','Imp гал/ч',4.54609]],
 'Момент затяжки':[['N·m','Н·м',1],['daN·m','даН·м',10],['lb·ft','фунт·фут',1.3558179483],['lb·in','фунт·дюйм',.112984829]],
 'Сила':[['N','Н',1],['daN','даН',10],['kN','кН',1000],['lbf','lbf',4.448221615]],
 'Мощность':[['W','Вт',1],['kW','кВт',1000],['hp','л.с. (мех.)',745.699872]],
 'Площадь':[['cm²','см²',.0001],['m²','м²',1],['km²','км²',1e6],['in²','дюйм²',.00064516],['ft²','фут²',.09290304],['acre','акр',4046.8564224]]
};
const category=document.querySelector('#category'),from=document.querySelector('#fromUnit'),to=document.querySelector('#toUnit'),input=document.querySelector('#fromValue'),output=document.querySelector('#toValue'),result=document.querySelector('#result');
const pairs=[['Длина','mm','in'],['Длина','m','ft'],['Давление','bar','psi'],['Давление','kPa','psi'],['Температура','C','F'],['Скорость','kt','mph'],['Момент затяжки','daN·m','lb·ft'],['Момент затяжки','N·m','lb·ft'],['Масса','kg','lb']];
function units(cat){return defs[cat].map(([id,label])=>({id,label}));}
function fillUnits(a,b){from.innerHTML='';to.innerHTML='';units(category.value).forEach(u=>{from.add(new Option(`${u.id} — ${u.label}`,u.id));to.add(new Option(`${u.id} — ${u.label}`,u.id));});from.value=a||defs[category.value][0][0];to.value=b||defs[category.value][1][0];convert();}
function temp(v,a,b){let c=a==='C'?v:a==='F'?(v-32)*5/9:v-273.15;return b==='C'?c:b==='F'?c*9/5+32:c+273.15;}
function convert(){let v=Number(input.value);if(input.value.trim()===''||!Number.isFinite(v)){output.value='';result.textContent='—';return;}let cat=category.value,a=from.value,b=to.value,arr=defs[cat],x=arr.find(z=>z[0]===a),y=arr.find(z=>z[0]===b);let r=cat==='Температура'?temp(v,a,b):v*x[2]/y[2];let s=Number(r.toPrecision(10)).toLocaleString('ru-RU',{maximumFractionDigits:8});output.value=s;result.innerHTML=`${s} <small>${b}</small>`;}
Object.keys(defs).forEach(k=>category.add(new Option(k,k)));category.addEventListener('change',()=>fillUnits());from.addEventListener('change',convert);to.addEventListener('change',convert);input.addEventListener('input',convert);
document.querySelector('#swap').addEventListener('click',()=>{let a=from.value;from.value=to.value;to.value=a;convert();});
document.querySelector('#reset').addEventListener('click',()=>{input.value='1';convert();});
document.querySelector('#copy').addEventListener('click',async()=>{if(!output.value)return;try{await navigator.clipboard.writeText(`${output.value} ${to.value}`);document.querySelector('#copy').textContent='Скопировано ✓';setTimeout(()=>document.querySelector('#copy').textContent='Копировать результат',1400);}catch(e){document.querySelector('#copy').textContent='Не удалось скопировать';}});
const quick=document.querySelector('#quick');pairs.forEach(([c,a,b])=>{let btn=document.createElement('button');btn.className='chip';btn.textContent=`${a} → ${b}`;btn.onclick=()=>{category.value=c;fillUnits(a,b);input.value='1';convert();};quick.append(btn);});
fillUnits('mm','in');
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(()=>document.querySelector('#status').textContent='● ОФЛАЙН ГОТОВ').catch(()=>document.querySelector('#status').textContent='● ЛОКАЛЬНЫЙ РЕЖИМ'));}
</script>
</body>
</html>
